[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-cube-solver"
version = "0.1.0"
description = "Optimal half-turn-metric 3x3 Rubik's cube solver: IDA* on the GPU with a GPU-resident pattern database"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "cupy-cuda13x>=14,<15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cuda-cube-solver = "cuda_cube_solver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuda_cube_solver = ["kernels.cu"]
